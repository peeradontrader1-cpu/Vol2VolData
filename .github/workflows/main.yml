name: Send Vol2Vol Image on Update
on:
  push:
    paths:
      - 'Intraday+OI.png'
      - 'IntradayData.txt'
      - 'OIData.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas requests pytz

      - name: Run script
        env:
          # ส่วนนี้คือการดึงค่าจากระบบ Secrets ของ GitHub มาส่งให้ Python
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_update.py
