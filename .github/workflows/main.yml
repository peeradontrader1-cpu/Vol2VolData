name: Gold Data 30m Update

on:
  schedule:
    # รันทุกนาทีที่ 0 และ 30 ของทุกชั่วโมง (เวลา UTC)
    # 0,30 * * * * ตรงกับเวลาไทยนาทีที่ 0 และ 30 ของทุกชั่วโมง
    - cron: '0,30 * * * *'
  workflow_dispatch: # สำหรับกดรันเองเพื่อทดสอบ

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install requests pandas pytz

      - name: Run Telegram Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_update.py
