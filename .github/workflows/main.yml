name: Send Vol2Vol Image Every 15 Min
on:
  schedule:
    - cron: '*/15 * * * *'  # รันทุกๆ 15 นาที (เช่น 00, 15, 30, 45)
  workflow_dispatch:        # ปุ่มกดมือ

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas requests pytz

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_update.py
